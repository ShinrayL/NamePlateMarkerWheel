<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamePlateMarkerWheel Logo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>NamePlateMarkerWheel</h1>
            <div class="subtitle">Radial Constellation Logo Generator - An 8-point radial wheel inspired by WoW raid markers</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <!-- Wheel Radius -->
                <div class="control-group">
                    <label>Wheel Radius</label>
                    <div class="slider-container">
                        <input type="range" id="wheelRadius" min="150" max="400" step="10" value="280" oninput="updateParam('wheelRadius', this.value)">
                        <span class="value-display" id="wheelRadius-value">280</span>
                    </div>
                </div>

                <!-- Mark Size -->
                <div class="control-group">
                    <label>Mark Size</label>
                    <div class="slider-container">
                        <input type="range" id="markSize" min="20" max="80" step="5" value="45" oninput="updateParam('markSize', this.value)">
                        <span class="value-display" id="markSize-value">45</span>
                    </div>
                </div>

                <!-- Connection Lines -->
                <div class="control-group">
                    <label>Connection Density</label>
                    <div class="slider-container">
                        <input type="range" id="connectionDensity" min="0" max="28" step="1" value="8" oninput="updateParam('connectionDensity', this.value)">
                        <span class="value-display" id="connectionDensity-value">8</span>
                    </div>
                </div>

                <!-- Particle Count -->
                <div class="control-group">
                    <label>Star Particles</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="50" max="500" step="25" value="200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">200</span>
                    </div>
                </div>

                <!-- Rotation -->
                <div class="control-group">
                    <label>Wheel Rotation</label>
                    <div class="slider-container">
                        <input type="range" id="rotation" min="0" max="360" step="5" value="0" oninput="updateParam('rotation', this.value)">
                        <span class="value-display" id="rotation-value">0</span>
                    </div>
                </div>

                <!-- Glow Intensity -->
                <div class="control-group">
                    <label>Glow Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="glowIntensity" min="0" max="30" step="2" value="15" oninput="updateParam('glowIntensity', this.value)">
                        <span class="value-display" id="glowIntensity-value">15</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Wheel Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Mark Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Particle Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#f4d03f" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#f4d03f</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Generating radial constellation...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // RADIAL CONSTELLATION LOGO PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 42,
            wheelRadius: 280,
            markSize: 45,
            connectionDensity: 8,
            particleCount: 200,
            rotation: 0,
            glowIntensity: 15,
            colorPalette: ['#d97757', '#6a9bcc', '#f4d03f']
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS RADIAL CONSTELLATION ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let markPositions = [];
        let connections = [];

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');

            initializeSystem();

            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            particles = [];
            markPositions = [];
            connections = [];

            // Generate 8 radial mark positions (octagonal symmetry)
            generateRadialMarks();

            // Generate connecting lines between marks
            generateConnections();

            // Generate ambient star particles
            generateStarParticles();
        }

        function generateRadialMarks() {
            const centerX = width / 2;
            const centerY = height / 2;
            const rotationRad = radians(params.rotation);

            for (let i = 0; i < 8; i++) {
                const angle = rotationRad + (TWO_PI / 8) * i - PI / 2;
                const x = centerX + cos(angle) * params.wheelRadius;
                const y = centerY + sin(angle) * params.wheelRadius;

                markPositions.push({
                    x: x,
                    y: y,
                    angle: angle,
                    index: i
                });
            }
        }

        function generateConnections() {
            connections = [];
            const density = params.connectionDensity;

            // Connect each mark to its neighbors
            for (let i = 0; i < markPositions.length; i++) {
                // Connect to next mark (wheel rim)
                const nextIndex = (i + 1) % markPositions.length;

                // Create curved connection between adjacent marks
                connections.push({
                    from: i,
                    to: nextIndex,
                    type: 'rim',
                    curvature: random(0.1, 0.3)
                });

                // Connect to center (spokes)
                connections.push({
                    from: i,
                    to: 'center',
                    type: 'spoke',
                    curvature: 0
                });

                // Additional cross-connections based on density
                if (density > 2) {
                    // Skip-one connections
                    const skipIndex = (i + 2) % markPositions.length;
                    connections.push({
                        from: i,
                        to: skipIndex,
                        type: 'cross',
                        curvature: random(-0.2, 0.2)
                    });
                }

                if (density > 4) {
                    // Skip-two connections (opposite side)
                    const farIndex = (i + 3) % markPositions.length;
                    connections.push({
                        from: i,
                        to: farIndex,
                        type: 'long',
                        curvature: random(-0.3, 0.3)
                    });
                }

                if (density > 6) {
                    // Opposite connections
                    const oppositeIndex = (i + 4) % markPositions.length;
                    connections.push({
                        from: i,
                        to: oppositeIndex,
                        type: 'diameter',
                        curvature: 0
                    });
                }
            }
        }

        function generateStarParticles() {
            const centerX = width / 2;
            const centerY = height / 2;

            for (let i = 0; i < params.particleCount; i++) {
                // Distribute particles with radial bias
                const angle = random(TWO_PI);
                const radiusBias = random(1) < 0.6 ?
                    random(params.wheelRadius * 0.3, params.wheelRadius * 1.3) :
                    random(0, params.wheelRadius * 1.5);

                const x = centerX + cos(angle) * radiusBias;
                const y = centerY + sin(angle) * radiusBias;

                particles.push({
                    x: x,
                    y: y,
                    size: random(1, 4),
                    brightness: random(0.3, 1.0),
                    twinkle: random(TWO_PI),
                    twinkleSpeed: random(0.02, 0.08)
                });
            }
        }

        function draw() {
            // Dark cosmic background
            background(15, 18, 25);

            // Draw ambient glow
            drawAmbientGlow();

            // Draw connection lines
            drawConnections();

            // Draw star particles
            drawStarParticles();

            // Draw radial marks
            drawRadialMarks();

            // Draw center hub
            drawCenterHub();

            noLoop();
        }

        function drawAmbientGlow() {
            const centerX = width / 2;
            const centerY = height / 2;
            const glowRadius = params.wheelRadius * 1.5;

            // Parse wheel color for glow
            const wheelColor = color(params.colorPalette[0]);

            for (let r = glowRadius; r > 0; r -= 10) {
                const alpha = map(r, 0, glowRadius, params.glowIntensity, 0);
                fill(red(wheelColor), green(wheelColor), blue(wheelColor), alpha);
                noStroke();
                ellipse(centerX, centerY, r * 2, r * 2);
            }
        }

        function drawConnections() {
            const centerX = width / 2;
            const centerY = height / 2;

            const wheelColor = color(params.colorPalette[0]);

            for (let conn of connections) {
                let x1, y1, x2, y2;

                if (conn.from === 'center') {
                    x1 = centerX;
                    y1 = centerY;
                } else {
                    x1 = markPositions[conn.from].x;
                    y1 = markPositions[conn.from].y;
                }

                if (conn.to === 'center') {
                    x2 = centerX;
                    y2 = centerY;
                } else {
                    x2 = markPositions[conn.to].x;
                    y2 = markPositions[conn.to].y;
                }

                // Set line style based on connection type
                let alpha = 80;
                let weight = 1.5;

                switch(conn.type) {
                    case 'rim':
                        alpha = 120;
                        weight = 2.5;
                        break;
                    case 'spoke':
                        alpha = 60;
                        weight = 1.5;
                        break;
                    case 'cross':
                        alpha = 40;
                        weight = 1;
                        break;
                    case 'long':
                    case 'diameter':
                        alpha = 25;
                        weight = 0.8;
                        break;
                }

                stroke(red(wheelColor), green(wheelColor), blue(wheelColor), alpha);
                strokeWeight(weight);

                if (conn.curvature === 0) {
                    line(x1, y1, x2, y2);
                } else {
                    // Draw curved connection
                    const midX = (x1 + x2) / 2;
                    const midY = (y1 + y2) / 2;
                    const controlX = midX + (y2 - y1) * conn.curvature;
                    const controlY = midY - (x2 - x1) * conn.curvature;

                    noFill();
                    beginShape();
                    vertex(x1, y1);
                    quadraticVertex(controlX, controlY, x2, y2);
                    endShape();
                }
            }
        }

        function drawStarParticles() {
            const particleColor = color(params.colorPalette[2]);

            for (let p of particles) {
                const twinkle = sin(frameCount * p.twinkleSpeed + p.twinkle);
                const alpha = p.brightness * map(twinkle, -1, 1, 100, 255);

                fill(red(particleColor), green(particleColor), blue(particleColor), alpha);
                noStroke();
                ellipse(p.x, p.y, p.size, p.size);
            }
        }

        function drawRadialMarks() {
            const markColor = color(params.colorPalette[1]);
            const secondaryColor = color(params.colorPalette[0]);

            // Raid marker symbols
            const symbols = ['★', '●', '◆', '▲', '☽', '■', '✕', '✦'];

            for (let i = 0; i < markPositions.length; i++) {
                const pos = markPositions[i];
                const size = params.markSize;

                // Glow behind mark
                fill(red(markColor), green(markColor), blue(markColor), 100);
                noStroke();
                ellipse(pos.x, pos.y, size * 1.5, size * 1.5);

                // Mark background circle
                fill(red(secondaryColor), green(secondaryColor), blue(secondaryColor), 200);
                stroke(255, 150);
                strokeWeight(2);
                ellipse(pos.x, pos.y, size, size);

                // Mark symbol
                fill(255);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(size * 0.6);
                text(symbols[i], pos.x, pos.y + size * 0.05);
            }
        }

        function drawCenterHub() {
            const centerX = width / 2;
            const centerY = height / 2;
            const hubSize = params.markSize * 1.2;

            const wheelColor = color(params.colorPalette[0]);
            const markColor = color(params.colorPalette[1]);

            // Outer glow
            for (let r = hubSize * 2; r > hubSize; r -= 5) {
                const alpha = map(r, hubSize, hubSize * 2, 150, 0);
                fill(red(wheelColor), green(wheelColor), blue(wheelColor), alpha);
                noStroke();
                ellipse(centerX, centerY, r, r);
            }

            // Center hub
            fill(red(markColor), green(markColor), blue(markColor), 230);
            stroke(255, 200);
            strokeWeight(3);
            ellipse(centerX, centerY, hubSize, hubSize);

            // Center symbol (clear/target symbol)
            fill(255);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(hubSize * 0.5);
            text('◎', centerX, centerY + hubSize * 0.02);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
            redraw();
        }

        function updateColor(colorId, value) {
            const index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
            redraw();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
                redraw();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
            redraw();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
            redraw();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
            redraw();
        }

        function resetParameters() {
            params = {...defaultParams};

            document.getElementById('wheelRadius').value = params.wheelRadius;
            document.getElementById('wheelRadius-value').textContent = params.wheelRadius;
            document.getElementById('markSize').value = params.markSize;
            document.getElementById('markSize-value').textContent = params.markSize;
            document.getElementById('connectionDensity').value = params.connectionDensity;
            document.getElementById('connectionDensity-value').textContent = params.connectionDensity;
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('rotation').value = params.rotation;
            document.getElementById('rotation-value').textContent = params.rotation;
            document.getElementById('glowIntensity').value = params.glowIntensity;
            document.getElementById('glowIntensity-value').textContent = params.glowIntensity;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
            redraw();
        }

        function downloadPNG() {
            saveCanvas('NamePlateMarkerWheel-Logo', 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
